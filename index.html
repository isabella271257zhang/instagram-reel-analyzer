<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Birthday Card for Dad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050308;
            font-family: 'Cinzel', 'Georgia', serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 电影感暗角与光晕叠加层 */
        .cinematic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle at center, rgba(255, 180, 100, 0.08) 0%, rgba(5, 3, 8, 0.6) 70%, rgba(0, 0, 0, 0.95) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        /* 摄像头隐藏界面与调试提示 */
        #video-input {
            display: none;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            color: #f0e6d2;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4757;
            box-shadow: 0 0 10px #ff4757;
        }

        .status-dot.active {
            background-color: #2ed573;
            box-shadow: 0 0 10px #2ed573;
        }

        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 15, 25, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            color: #ebd197;
            text-align: center;
            letter-spacing: 1px;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 隐藏 MediaPipe 内部 Canvas */
        .output_canvas {
            display: none;
        }
    </style>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Tween.js 为平滑动画 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

    <div id="canvas-container"></div>
    <div class="cinematic-overlay"></div>

    <div id="ui-layer">
        <div class="status-badge">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">Initializing Camera & AI...</span>
        </div>
    </div>

    <div class="instructions">
        🖐 Open Hand: Open Card &nbsp;|&nbsp; ✊ Close Hand: Close Card &nbsp;|&nbsp; 🖱️ Drag to Rotate
    </div>

    <video id="video-input"></video>

    <script>
        // --- 1. Web Audio API 生日快乐歌合成器 ---
        class BirthdayAudio {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.notes = [
                    { note: 'C4', duration: 0.35 }, { note: 'C4', duration: 0.15 },
                    { note: 'D4', duration: 0.5 }, { note: 'C4', duration: 0.5 },
                    { note: 'F4', duration: 0.5 }, { note: 'E4', duration: 1.0 },
                    
                    { note: 'C4', duration: 0.35 }, { note: 'C4', duration: 0.15 },
                    { note: 'D4', duration: 0.5 }, { note: 'C4', duration: 0.5 },
                    { note: 'G4', duration: 0.5 }, { note: 'F4', duration: 1.0 },
                    
                    { note: 'C4', duration: 0.35 }, { note: 'C4', duration: 0.15 },
                    { note: 'C5', duration: 0.5 }, { note: 'A4', duration: 0.5 },
                    { note: 'F4', duration: 0.5 }, { note: 'E4', duration: 0.5 },
                    { note: 'D4', duration: 0.8 },
                    
                    { note: 'A#4', duration: 0.35 }, { note: 'A#4', duration: 0.15 },
                    { note: 'A4', duration: 0.5 }, { note: 'F4', duration: 0.5 },
                    { note: 'G4', duration: 0.5 }, { note: 'F4', duration: 1.2 }
                ];
                this.freqMap = {
                    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
                    'G4': 392.00, 'A4': 440.00, 'A#4': 466.16, 'C5': 523.25
                };
                this.timeoutIds = [];
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            play() {
                this.init();
                this.stop();
                this.isPlaying = true;

                let currentTime = this.ctx.currentTime + 0.1;
                let tempo = 1.1; 

                this.notes.forEach((item) => {
                    let duration = item.duration * tempo;
                    let freq = this.freqMap[item.note];
                    
                    let tid = setTimeout(() => {
                        if (this.isPlaying) this.playTone(freq, duration);
                    }, (currentTime - this.ctx.currentTime) * 1000);
                    
                    this.timeoutIds.push(tid);
                    currentTime += duration;
                });
            }

            playTone(freq, duration) {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration - 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            stop() {
                this.isPlaying = false;
                this.timeoutIds.forEach(id => clearTimeout(id));
                this.timeoutIds = [];
            }
        }

        const audioPlayer = new BirthdayAudio();

        // --- 2. THREE.JS 场景构建 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050308, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 5;
        controls.maxDistance = 20;

        // --- 3. 灯光与烛光营造 ---
        const ambientLight = new THREE.AmbientLight(0xffecd1, 0.4);
        scene.add(ambientLight);

        // 主烛光点光源（暖黄色柔光）
        const candleLight = new THREE.PointLight(0xffaa44, 2.5, 15);
        candleLight.position.set(0, 1, 2);
        candleLight.castShadow = true;
        candleLight.shadow.mapSize.width = 1024;
        candleLight.shadow.mapSize.height = 1024;
        scene.add(candleLight);

        // 电影侧面冷调补光
        const rimLight = new THREE.DirectionalLight(0x6688ff, 0.8);
        rimLight.position.set(-10, 8, -5);
        scene.add(rimLight);

        // 背景氛围烛火微粒
        const ambientParticlesGeo = new THREE.BufferGeometry();
        const particleCount = 250;
        const posArray = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i+=3) {
            posArray[i] = (Math.random() - 0.5) * 20;
            posArray[i+1] = (Math.random() - 0.5) * 15;
            posArray[i+2] = (Math.random() - 0.5) * 20;
        }
        ambientParticlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const ambientParticlesMat = new THREE.PointsMaterial({
            size: 0.06,
            color: 0xffaa33,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const ambientParticles = new THREE.Points(ambientParticlesGeo, ambientParticlesMat);
        scene.add(ambientParticles);

        // --- 4. 生成动态纹理 ---
        // 封面：可爱彩色蛋糕图案
        function createCoverTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1440;
            const ctx = canvas.getContext('2d');

            // 底色 - 典雅复古暗绿/金边
            ctx.fillStyle = '#1e2d24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 花纹边框
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 16;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
            ctx.lineWidth = 4;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            // 标题
            ctx.fillStyle = '#fceabb';
            ctx.font = 'bold 70px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.fillText('HAPPY BIRTHDAY', canvas.width / 2, 220);

            // 绘制可爱彩色蛋糕
            const cx = canvas.width / 2;
            const cy = 850;

            // 蛋糕底层
            ctx.fillStyle = '#ff758c';
            ctx.beginPath();
            ctx.roundRect(cx - 220, cy - 120, 440, 220, [20, 20, 10, 10]);
            ctx.fill();

            // 蛋糕奶油波浪
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx - 160, cy - 120, 30, 0, Math.PI * 2);
            ctx.arc(cx - 80, cy - 120, 30, 0, Math.PI * 2);
            ctx.arc(cx, cy - 120, 30, 0, Math.PI * 2);
            ctx.arc(cx + 80, cy - 120, 30, 0, Math.PI * 2);
            ctx.arc(cx + 160, cy - 120, 30, 0, Math.PI * 2);
            ctx.fill();

            // 蛋糕顶层
            ctx.fillStyle = '#70a1ff';
            ctx.beginPath();
            ctx.roundRect(cx - 160, cy - 300, 320, 180, [15, 15, 10, 10]);
            ctx.fill();

            // 顶层奶油
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx - 100, cy - 300, 25, 0, Math.PI * 2);
            ctx.arc(cx - 30, cy - 300, 25, 0, Math.PI * 2);
            ctx.arc(cx + 40, cy - 300, 25, 0, Math.PI * 2);
            ctx.arc(cx + 110, cy - 300, 25, 0, Math.PI * 2);
            ctx.fill();

            // 彩色糖果点缀
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#eccc68', '#1e90ff'];
            for(let i=0; i<35; i++) {
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.arc(cx - 190 + Math.random()*380, cy - 260 + Math.random()*320, 8 + Math.random()*6, 0, Math.PI*2);
                ctx.fill();
            }

            // 蜡烛
            ctx.fillStyle = '#ff6b81';
            ctx.fillRect(cx - 12, cy - 420, 24, 120);
            // 蜡烛条纹
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(cx - 12, cy - 400); ctx.lineTo(cx + 12, cy - 380); ctx.lineTo(cx + 12, cy - 360); ctx.lineTo(cx - 12, cy - 380); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(cx - 12, cy - 350); ctx.lineTo(cx + 12, cy - 330); ctx.lineTo(cx + 12, cy - 310); ctx.lineTo(cx - 12, cy - 330); ctx.fill();

            // 火焰
            ctx.fillStyle = '#ffa502';
            ctx.beginPath();
            ctx.arc(cx, cy - 440, 16, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fffa65';
            ctx.beginPath();
            ctx.arc(cx, cy - 440, 8, 0, Math.PI*2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        // 内页：祝福语文本
        function createInsideTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1440;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#fcf8f2';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 柔和优雅的内边框
            ctx.strokeStyle = '#c8a951';
            ctx.lineWidth = 6;
            ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

            ctx.fillStyle = '#2b2b2b';
            ctx.textAlign = 'left';

            // 标题 Dear Dad
            ctx.font = 'bold 72px "Cinzel", serif';
            ctx.fillStyle = '#8b0000';
            ctx.fillText('Dear Dad,', 120, 220);

            ctx.font = 'bold 56px "Cinzel", serif';
            ctx.fillStyle = '#b8860b';
            ctx.fillText('Happy Birthday!', 120, 320);

            // 英文祝福段落
            ctx.fillStyle = '#333333';
            ctx.font = '36px "Georgia", serif';
            const lines = [
                "Thank you for your endless wisdom,",
                "unconditional love, and unwavering support.",
                "May your special day be filled with joy,",
                "laughter, warmth, and wonderful moments.",
                "",
                "Wishing you health, happiness,",
                "and success in every year ahead!"
            ];

            let startY = 460;
            lines.forEach(line => {
                ctx.fillText(line, 120, startY);
                startY += 65;
            });

            // 落款与日期
            ctx.textAlign = 'right';
            ctx.font = '50px "Georgia", serif';
            ctx.fillStyle = '#8b0000';
            ctx.fillText('Yours always,', canvas.width - 120, 1150);

            ctx.font = 'bold 64px "Segoe UI Emoji", "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillStyle = '#d63031';
            ctx.fillText('抱抱', canvas.width - 120, 1240);

            ctx.font = '32px "Georgia", serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('2026.9.10', canvas.width - 120, 1310);

            return new THREE.CanvasTexture(canvas);
        }

        // --- 5. 构建 3D 贺卡结构 ---
        const cardGroup = new THREE.Group();
        scene.add(cardGroup);

        const cardWidth = 4.2;
        const cardHeight = 6.0;
        const cardThickness = 0.05;

        // 贺卡底板 (Base Back Cover)
        const backGeo = new THREE.BoxGeometry(cardWidth, cardHeight, cardThickness);
        const insideTex = createInsideTexture();
        const paperMat = new THREE.MeshStandardMaterial({ color: 0xfcf8f2, roughness: 0.6 });
        const insideMat = new THREE.MeshStandardMaterial({ map: insideTex, roughness: 0.4 });

        const backMaterials = [
            paperMat, paperMat, paperMat, paperMat,
            insideMat, // 正面内页
            paperMat   // 背面
        ];
        const backCard = new THREE.Mesh(backGeo, backMaterials);
        backCard.position.set(0, -cardHeight / 2, 0);
        backCard.receiveShadow = true;
        cardGroup.add(backCard);

        // 贺卡封面 (Top Cover with Pivot at Top Axis)
        // 创建铰链 Pivot 用于向上翻开
        const coverPivot = new THREE.Group();
        coverPivot.position.set(0, 0, cardThickness / 2);
        cardGroup.add(coverPivot);

        const coverGeo = new THREE.BoxGeometry(cardWidth, cardHeight, cardThickness);
        const coverTex = createCoverTexture();
        const coverMat = new THREE.MeshStandardMaterial({ map: coverTex, roughness: 0.3 });
        const coverInsideMat = new THREE.MeshStandardMaterial({ color: 0xfbf7f0, roughness: 0.5 });

        const coverMaterials = [
            paperMat, paperMat, paperMat, paperMat,
            coverMat,      // 前封面
            coverInsideMat // 内侧
        ];
        const coverCard = new THREE.Mesh(coverGeo, coverMaterials);
        coverCard.position.set(0, cardHeight / 2, 0);
        coverCard.castShadow = true;
        coverPivot.add(coverCard);

        // 调整贺卡初始整体倾角与位置
        cardGroup.position.set(0, 0, 0);
        cardGroup.rotation.x = THREE.MathUtils.degToRad(-15);

        // --- 6. 彩色爱心与彩带粒子系统 ---
        const confettiGroup = new THREE.Group();
        scene.add(confettiGroup);

        // 创建爱心 Shape
        const heartShape = new THREE.Shape();
        const x = 0, y = 0;
        heartShape.moveTo(x + 0.25, y + 0.25);
        heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
        heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
        heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
        heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
        heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
        heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

        const heartGeo = new THREE.ShapeGeometry(heartShape);
        heartGeo.scale(0.18, 0.18, 0.18);
        heartGeo.center();

        const ribbonGeo = new THREE.PlaneGeometry(0.12, 0.35);

        const confettiColors = [0xff4757, 0xff6b81, 0xffa502, 0x2ed573, 0x1e90ff, 0x9b59b6, 0xff78ae];
        const confettiItems = [];

        function createConfettiBurst() {
            // 清空旧粒子
            while(confettiGroup.children.length > 0){ 
                confettiGroup.remove(confettiGroup.children[0]); 
            }
            confettiItems.length = 0;

            const total = 90;
            for(let i = 0; i < total; i++) {
                const isHeart = Math.random() > 0.4;
                const mat = new THREE.MeshStandardMaterial({
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    side: THREE.DoubleSide,
                    roughness: 0.4,
                    metalness: 0.1
                });

                const mesh = new THREE.Mesh(isHeart ? heartGeo : ribbonGeo, mat);
                mesh.position.set(0, -0.5, 0); // 从贺卡中心飞出

                const angle = Math.random() * Math.PI * 2;
                const speed = 2.5 + Math.random() * 5.5;
                const vx = Math.cos(angle) * speed * (0.6 + Math.random() * 0.8);
                const vy = 3.0 + Math.random() * 6.0; // 向上喷发
                const vz = (Math.random() - 0.5) * speed * 1.5;

                mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);

                confettiGroup.add(mesh);
                confettiItems.push({
                    mesh: mesh,
                    vx: vx, vy: vy, vz: vz,
                    rotX: (Math.random() - 0.5) * 0.2,
                    rotY: (Math.random() - 0.5) * 0.2,
                    rotZ: (Math.random() - 0.5) * 0.2,
                    opacity: 1.0
                });
            }
        }

        function updateConfetti(delta) {
            confettiItems.forEach(item => {
                item.mesh.position.x += item.vx * delta;
                item.mesh.position.y += item.vy * delta;
                item.mesh.position.z += item.vz * delta;

                item.vy -= 7.5 * delta; // 重力效果

                item.mesh.rotation.x += item.rotX;
                item.mesh.rotation.y += item.rotY;
                item.mesh.rotation.z += item.rotZ;
            });
        }

        // --- 7. 贺卡开合控制与状态过渡 ---
        let isCardOpen = false;
        let currentTween = null;

        function setCardState(open) {
            if (isCardOpen === open) return;
            isCardOpen = open;

            if (currentTween) currentTween.stop();

            // 目标旋转角度：张开为向上翻开 160 度，闭合为 0 度
            const targetAngle = open ? THREE.MathUtils.degToRad(160) : 0;

            currentTween = new TWEEN.Tween(coverPivot.rotation)
                .to({ x: targetAngle }, 1400)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            if (open) {
                // 打开时触发喷彩带与播放音乐
                createConfettiBurst();
                audioPlayer.play();
            } else {
                audioPlayer.stop();
            }
        }

        // --- 8. MediaPipe Hands 手势检测 ---
        const videoElement = document.getElementById('video-input');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        function calculateHandOpenness(landmarks) {
            // 计算 4 个手指尖端到手掌基部 (Landmark 0) 的距离平均值
            const wrist = landmarks[0];
            const fingerTips = [8, 12, 16, 20]; // 食指、中指、无名指、小指尖端
            const mcpJoints = [5, 9, 13, 17];  // 指根关节点

            let tipDistSum = 0;
            let mcpDistSum = 0;

            fingerTips.forEach((tipIdx, i) => {
                const tip = landmarks[tipIdx];
                const mcp = landmarks[mcpJoints[i]];

                tipDistSum += Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
                mcpDistSum += Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y, mcp.z - wrist.z);
            });

            // 比例大于 1.7 判定为张开手掌，小于 1.3 判定为闭合
            return tipDistSum / mcpDistSum;
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDot.classList.add('active');
                
                const landmarks = results.multiHandLandmarks[0];
                const ratio = calculateHandOpenness(landmarks);

                if (ratio > 1.65) {
                    statusText.textContent = "Hand Detected: Open (Opening Card)";
                    setCardState(true);
                } else if (ratio < 1.35) {
                    statusText.textContent = "Hand Detected: Closed (Closing Card)";
                    setCardState(false);
                } else {
                    statusText.textContent = "Hand Detected: Tracking...";
                }
            } else {
                statusDot.classList.remove('active');
                statusText.textContent = "Camera Ready (Show Hand to Control)";
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        cameraUtils.start().then(() => {
            statusText.textContent = "Camera Ready (Show Hand to Control)";
        }).catch(err => {
            console.warn("Camera failed or access denied:", err);
            statusText.textContent = "Camera Disabled (Mouse Drag Allowed)";
        });

        // --- 9. 渲染循环与窗口自适应 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const delta = clock.getDelta();

            TWEEN.update();
            controls.update();

            // 动态微弱烛光的强度闪烁效果
            candleLight.intensity = 2.2 + Math.sin(elapsedTime * 8) * 0.25 + Math.cos(elapsedTime * 13) * 0.15;
            candleLight.position.x = Math.sin(elapsedTime * 3) * 0.1;

            // 氛围粒子漂浮
            const positions = ambientParticles.geometry.attributes.position.array;
            for(let i = 1; i < particleCount * 3; i += 3) {
                positions[i] += Math.sin(elapsedTime + i) * 0.003;
                if(positions[i] > 8) positions[i] = -8;
            }
            ambientParticles.geometry.attributes.position.needsUpdate = true;

            // 更新爱心彩带粒子
            updateConfetti(0.016);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
